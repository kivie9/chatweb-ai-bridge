<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>AI Web Bridge — Status</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface-elevated: #16161a;
      --surface-input: #0c0c0e;
      --border: #222226;
      --border-strong: #323238;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.12);
      --emerald-border: rgba(16, 185, 129, 0.25);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.1);
      --red-border: rgba(239, 68, 68, 0.25);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 12px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 11px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .header h1 {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .version-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 9999px;
    }

    .status-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .status-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      border: 1px solid transparent;
    }

    .badge-ok {
      background: var(--emerald-soft);
      color: #34d399;
      border-color: var(--emerald-border);
    }

    .badge-err {
      background: var(--red-soft);
      color: #f87171;
      border-color: var(--red-border);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #fafafa;
      color: #09090b;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e4e4e7;
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #202026;
      border-color: #42424a;
    }

    .btn-danger {
      background: var(--red-soft);
      color: #f87171;
      border-color: var(--red-border);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .tip {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.4;
      text-align: center;
    }

    .settings-section {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-title {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      padding: 2px 4px;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .settings-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .input-control {
      background: var(--surface-input);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 6px 9px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      width: 100%;
      outline: none;
    }

    .input-control:focus {
      border-color: #71717a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <path d="M10 6.5h3a2 2 0 0 1 2 2V14"></path>
          <path d="M6.5 10v5.5a2 2 0 0 0 2 2H14"></path>
        </svg>
      </div>
      <h1>AI Web Bridge</h1>
    </div>
    <span class="version-pill">v2.1</span>
  </div>

  <div class="status-group">
    <div class="status-item">
      <span id="server-label">Local Server</span>
      <span id="server-badge" class="badge badge-err"><span class="dot"></span> Chưa nối</span>
    </div>
    <div class="status-item">
      <span>ChatGPT Web</span>
      <span id="chatgpt-badge" class="badge badge-err"><span class="dot"></span> Chưa mở</span>
    </div>
    <div class="status-item">
      <span>Google Gemini</span>
      <span id="gemini-badge" class="badge badge-err"><span class="dot"></span> Chưa mở</span>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-reconnect" class="btn btn-secondary" style="flex:1;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      <span>Nối lại</span>
    </button>
    <button id="btn-clear-queue" class="btn btn-danger" style="flex:1.15;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Dọn hàng đợi</span>
    </button>
    <button id="btn-open-sidepanel" class="btn btn-secondary" style="flex:0.95;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      <span>Console</span>
    </button>
  </div>

  <div class="btn-row">
    <a id="btn-open-chatgpt" href="https://chatgpt.com" target="_blank" class="btn btn-secondary">
      <span>Mở ChatGPT</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>
    <a id="btn-open-gemini" href="https://gemini.google.com/app" target="_blank" class="btn btn-secondary">
      <span>Mở Gemini</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>
  </div>

  <div class="tip">
    ChatGPT và Gemini có thể xử lý song song trên cùng server.
  </div>

  <div class="settings-section">
    <div class="settings-header">
      <span class="settings-title">Cấu hình Server (Local / Online)</span>
      <button id="btn-toggle-settings" class="btn-link">Sửa</button>
    </div>
    <div id="settings-panel" class="settings-form">
      <input type="text" id="input-server-url" class="input-control" placeholder="http://localhost:9603 hoặc https://vps.com" />
      <input type="password" id="input-worker-token" class="input-control" placeholder="Worker Token (tùy chọn)" />
      <button id="btn-save-server" class="btn btn-primary">Lưu &amp; Kết nối</button>
    </div>
  </div>

  <script src="shared/bridge-constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
